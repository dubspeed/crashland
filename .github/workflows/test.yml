name: tests
on:
  push:
  pull_request:
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:full # every rescue combination (npm test flies a selection)
      - run: npm run build
